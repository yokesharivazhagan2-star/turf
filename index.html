<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <title>TURFBOOK — Multi-Turf Sports Booking Marketplace</title>
    <meta name="description" content="Discover, compare and book multi-sport turfs in real-time. Live slot locking, team bookings, GPS nearby search, and owner marketplace." />
    
    <!-- Fonts: Plus Jakarta Sans & Outfit for sports tech feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Leaflet CSS for Dark Sports Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              turf: {
                DEFAULT: '#22c55e',
                dark: '#15803d',
                light: '#4ade80',
                glow: 'rgba(34, 197, 94, 0.28)'
              }
            },
            fontFamily: {
              heading: ['Outfit', 'sans-serif'],
              body: ['Plus Jakarta Sans', 'sans-serif']
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-dark text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
